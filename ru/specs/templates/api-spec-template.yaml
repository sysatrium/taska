openapi: 3.1.0
info:
  title: Шаблон API-контракта фичи
  version: 0.1.0
  description: >-
    Шаблон для feature-level API-контрактов, которые создаются до реализации.
servers:
  - url: https://api.example.com
    description: Плейсхолдер сервера
tags:
  - name: feature
    description: Замените на тег конкретной фичи
paths:
  /example-resource:
    get:
      tags: [feature]
      summary: Опишите операцию чтения
      operationId: getExampleResource
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Замените на реальное описание параметра
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Требуется аутентификация
        '403':
          description: Доступ запрещён
        '404':
          description: Ресурс не найден
        '500':
          description: Внутренняя ошибка сервера
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ExampleResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          description: Замените на бизнес-смысл состояния
        meta
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
security:
  - bearerAuth: []
