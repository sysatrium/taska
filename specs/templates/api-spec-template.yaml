openapi: 3.0.3
info:
  title: Feature API Template
  version: 0.1.0
  description: >-
    Template for feature-level API contracts. Replace placeholder content with
    the real interface before implementation begins.
servers:
  - url: https://api.example.com
    description: Example production server
security: []
paths:
  /example:
    get:
      summary: Example operation
      operationId: getExample
      tags:
        - Example
      parameters:
        - name: requestId
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ExampleResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ok]
      required: [id, status]
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
      required: [code, message]
