openapi: 3.1.0
info:
  title: Feature API Contract Template
  version: 0.1.0
  description: >-
    Template for feature-level API contracts created before implementation.
servers:
  - url: https://api.example.com
    description: Example server placeholder
tags:
  - name: feature
    description: Replace with feature-specific tag
paths:
  /example-resource:
    get:
      tags: [feature]
      summary: Describe the read operation
      operationId: getExampleResource
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Replace with real query parameter description
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ExampleResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          description: Replace with business-specific state meaning
        meta
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
security:
  - bearerAuth: []
